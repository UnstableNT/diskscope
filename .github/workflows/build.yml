name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build DiskScope.sln -c Release -warnaserror

      - name: Format
        run: dotnet format DiskScope.sln --verify-no-changes --no-restore

      # Unit tests only; hardware and admin tests need real drives / test VHDs (see README).
      - name: Unit tests
        run: tests/DiskScope.Core.Tests/bin/Release/net10.0-windows10.0.19041.0/DiskScope.Core.Tests.exe -noLogo

      - name: Publish CLI
        run: dotnet publish src/DiskScope.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/cli

      - name: Publish app
        run: dotnet publish src/DiskScope.App -c Release -r win-x64 -p:Platform=x64 -o publish/app

      # Signing: after admission to the SignPath Foundation this artifact is submitted for signing
      # (signpath/github-action-submit-signing-request) and the signed files are released.
      - uses: actions/upload-artifact@v4
        with:
          name: diskscope-win-x64
          path: publish/
          if-no-files-found: error
